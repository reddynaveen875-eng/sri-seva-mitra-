name: Build Sri Seva Mitra APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SriSevaMitra-source.zip'
      - '.github/workflows/build-sri-seva-mitra-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract source and find project
        shell: bash
        run: |
          test -f SriSevaMitra-source.zip || {
            echo "SriSevaMitra-source.zip is missing from the repository root."
            exit 1
          }

          mkdir extracted
          unzip -q SriSevaMitra-source.zip -d extracted

          settings="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [[ -z "$settings" ]]; then
            echo "No settings.gradle or settings.gradle.kts found in the ZIP."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          project_dir="$(dirname "$settings")"
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Found project at: $project_dir"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [[ -f gradlew ]]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SriSevaMitra-apk
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
